
# ~BrieFlow analysis configuration file~

# All paths are resolved relative to the directory the workflow is run from.

# Parameters:
all:
  root_fp: brieflow_output/
  image_format: zarr
preprocess:
  sbs_samples_fp: config/sbs_samples.tsv
  sbs_combo_fp: config/sbs_combo.tsv
  phenotype_samples_fp: config/phenotype_samples.tsv
  phenotype_combo_fp: config/phenotype_combo.tsv
  sbs_data_format: tiff
  sbs_data_organization: tile
  sbs_channel_order:
  - ch1
  - ch2
  - ch3
  - ch4
  sbs_channel_order_flip: false
  sbs_n_z_planes: 1
  sbs_metadata_samples_df_fp: config/sbs_metadata_samples.tsv
  phenotype_data_format: tiff
  phenotype_data_organization: tile
  phenotype_channel_order:
  - ch1
  - ch2
  - ch3
  - ch4
  - ch5
  - ch6
  phenotype_channel_order_flip: false
  phenotype_round_order:
  - 1
  phenotype_n_z_planes: 1
  phenotype_metadata_samples_df_fp: config/phenotype_metadata_samples.tsv
  sample_fraction: 0.1
  sbs_channels_metadata:
  - name: DAPI
    index: 0
    channel_type: fluorescent
    color: pure_blue
    description: null
    biological_annotation:
      biological_target: null
      marker: null
      marker_type: null
      full_label: null
  - name: Alexa 568
    index: 1
    channel_type: fluorescent
    color: pure_green
    description: null
    biological_annotation:
      biological_target: null
      marker: null
      marker_type: null
      full_label: null
  - name: Alexa 488
    index: 2
    channel_type: fluorescent
    color: pure_red
    description: null
    biological_annotation:
      biological_target: null
      marker: null
      marker_type: null
      full_label: null
  - name: Alexa 647
    index: 3
    channel_type: fluorescent
    color: pure_magenta
    description: null
    biological_annotation:
      biological_target: null
      marker: null
      marker_type: null
      full_label: null
  phenotype_channels_metadata:
  - name: Brightfield
    index: 0
    channel_type: fluorescent
    color: pure_blue
    description: null
    biological_annotation:
      biological_target: Transmitted light
      marker: Brightfield
      marker_type: brightfield
      full_label: Transmitted light, Brightfield
  - name: ConA
    index: 1
    channel_type: fluorescent
    color: pure_green
    description: null
    biological_annotation:
      biological_target: Endoplasmic Reticulum
      marker: Concanavalin A
      marker_type: dye
      full_label: Endoplasmic Reticulum, Concanavalin A
  - name: AGP
    index: 2
    channel_type: fluorescent
    color: pure_red
    description: null
    biological_annotation:
      biological_target: Actin / Golgi / Plasma Membrane
      marker: Phalloidin + WGA
      marker_type: dye
      full_label: Actin / Golgi / Plasma Membrane, Phalloidin + WGA
  - name: DAPI
    index: 3
    channel_type: fluorescent
    color: pure_magenta
    description: null
    biological_annotation:
      biological_target: Nuclei
      marker: DNA
      marker_type: dye
      full_label: Nuclei, DNA
  - name: SYTO14
    index: 4
    channel_type: fluorescent
    color: pure_cyan
    description: null
    biological_annotation:
      biological_target: Nucleoli / RNA
      marker: SYTO 14
      marker_type: dye
      full_label: Nucleoli / RNA, SYTO 14
  - name: Mito
    index: 5
    channel_type: fluorescent
    color: pure_yellow
    description: null
    biological_annotation:
      biological_target: Mitochondria
      marker: MitoTracker Deep Red
      marker_type: dye
      full_label: Mitochondria, MitoTracker Deep Red
