  peak_width: 5
  nuclei_diameter: 11.11324596323283
  cell_diameter: 20.790973787713106
  nuclei_flow_threshold: 0.4
  nuclei_cellprob_threshold: 0
  cell_flow_threshold: 1
  cell_cellprob_threshold: 0
  cellpose_model: cyto3
phenotype:
  foci_channel_index: null
  channel_names:
  - Brightfield
  - ConA
  - AGP
  - DAPI
  - SYTO14
  - Mito
